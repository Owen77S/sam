# Finetuning de sam3 sur un fold et une classe de data/base.
# Usage : FOLD=3 CLASS=LC docker compose -f docker-compose-train.yml up
#   FOLD  : 1 à 5
#   CLASS : LM, FC, LC ou VV
# Les données doivent avoir été préparées par final_scripts/run_pipeline.sh.

services:
  train:
    build:
      context: .
      dockerfile: DockerfileVPS
    # HF_TOKEN est lu depuis .env (à créer sur la machine, à ne pas envoyer)
    env_file: .env
    environment:
      DATASET: base/fold_${FOLD:?FOLD doit valoir 1 à 5}
      CLASS: ${CLASS:?CLASS doit valoir LM, FC, LC ou VV}
      LOG_DIR: /app/logs/fold_${FOLD}_${CLASS}
    working_dir: /app/sam3
    command: python sam3/train/train.py -c configs/finetune/docker_config.yaml --use-cluster 0 --num-gpus 1
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
    # mémoire partagée pour les workers du DataLoader (64 Mo par défaut)
    shm_size: "8gb"
    # accès au GPU : nécessite nvidia-container-toolkit sur l'hôte
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
